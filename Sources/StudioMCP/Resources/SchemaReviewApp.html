<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schema review</title>
<style>
:root {
  color-scheme: light dark;
  --fb-bg: #ffffff; --fb-bg-2: #f6f5f1; --fb-text: #1f1e1c; --fb-text-2: #5f5e5a; --fb-text-3: #8a8983;
  --fb-border: rgba(31, 30, 28, 0.16); --fb-border-2: rgba(31, 30, 28, 0.08);
  --add: #16a34a; --mod: #2563eb; --del: #dc2626;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fb-bg: #1f1f1e; --fb-bg-2: #262624; --fb-text: #f2f1ed; --fb-text-2: #b7b5ad; --fb-text-3: #8f8d86;
    --fb-border: rgba(242, 241, 237, 0.18); --fb-border-2: rgba(242, 241, 237, 0.09);
    --add: #4ade80; --mod: #7aa7ff; --del: #f38b8b;
  }
}
:root[data-theme="dark"] {
  --fb-bg: #1f1f1e; --fb-bg-2: #262624; --fb-text: #f2f1ed; --fb-text-2: #b7b5ad; --fb-text-3: #8f8d86;
  --fb-border: rgba(242, 241, 237, 0.18); --fb-border-2: rgba(242, 241, 237, 0.09);
  --add: #4ade80; --mod: #7aa7ff; --del: #f38b8b;
}
:root {
  --bg: var(--color-background-primary, var(--fb-bg));
  --bg-2: var(--color-background-secondary, var(--fb-bg-2));
  --text: var(--color-text-primary, var(--fb-text));
  --text-2: var(--color-text-secondary, var(--fb-text-2));
  --text-3: var(--color-text-tertiary, var(--fb-text-3));
  --border: var(--color-border-primary, var(--fb-border));
  --border-2: var(--color-border-secondary, var(--fb-border-2));
  --font: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif);
  --mono: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
  --radius: var(--border-radius-md, 8px);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: transparent; color: var(--text); font-family: var(--font); font-size: 13px; line-height: 1.45; }
body { padding: 10px 12px 12px; }
button { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 3px 10px; cursor: pointer; }
button:hover { background: var(--bg-2); }
button:focus-visible, a:focus-visible, summary:focus-visible, .canvas:focus-visible, .node:focus-visible { outline: 2px solid var(--mod); outline-offset: 2px; }
.bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.spacer { flex: 1; }
.brand { display: inline-flex; align-items: center; gap: 7px; border: 0; background: transparent; padding: 2px 6px 2px 2px; font-size: 14px; font-weight: 600; }
.brand img { width: 22px; height: 22px; display: block; }
.brand:hover { background: var(--bg-2); }
.badge { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--bg-2); color: var(--text-2); white-space: nowrap; }
.legend { display: inline-flex; gap: 10px; color: var(--text-2); font-size: 12px; }
.chip { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.dot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; flex: none; }
.dot.added { border: 2px solid var(--add); }
.dot.modified { border: 2px solid var(--mod); }
.dot.removed { border: 2px dashed var(--del); }
.sets { display: inline-flex; align-items: center; gap: 8px; }
.position { color: var(--text-2); font-size: 12px; white-space: nowrap; }
.toast { color: var(--text-2); font-size: 12px; margin: -2px 0 6px; }
.toast.error { color: var(--del); }
.canvas { position: relative; height: 460px; border: 1px solid var(--border-2); border-radius: var(--radius); background: var(--bg-2); overflow: hidden; touch-action: none; cursor: default; user-select: none; -webkit-user-select: none; }
.canvas.panning { cursor: grabbing; }
.canvas img.frame { position: absolute; left: 0; top: 0; pointer-events: none; }
.canvas svg { display: block; width: 100%; height: 100%; }
.loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--text-2); font-size: 12.5px; }
.loading::before { content: ""; width: 12px; height: 12px; margin-right: 8px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--text-2); animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.zoom { position: absolute; right: 8px; bottom: 8px; display: flex; gap: 4px; }
.zoom button { padding: 1px 8px; background: var(--bg); opacity: 0.92; }
.note { position: absolute; left: 8px; bottom: 8px; font-size: 11px; color: var(--text-3); background: var(--bg); border-radius: 6px; padding: 1px 6px; opacity: 0.92; }
.changes { margin-top: 8px; border: 1px solid var(--border-2); border-radius: var(--radius); background: var(--bg); }
.changes summary { display: flex; align-items: center; gap: 8px; padding: 6px 10px; cursor: pointer; font-size: 12px; font-weight: 600; list-style: none; }
.changes summary::-webkit-details-marker { display: none; }
.changes summary::before { content: "›"; color: var(--text-3); font-size: 17px; line-height: 12px; transition: transform 0.15s; }
.changes[open] summary::before { transform: rotate(90deg); }
.changes-count { color: var(--text-3); font-size: 11px; font-weight: 400; }
.changes-body { max-height: 260px; overflow-y: auto; border-top: 1px solid var(--border-2); padding: 4px 10px 8px; font-size: 12px; }
.changes-body .change-table { padding: 6px 0; border-bottom: 1px solid var(--border-2); }
.changes-body .change-table:last-child { border-bottom: 0; }
.changes-body .change-fields, .changes-body .change-relations { display: flex; flex-wrap: wrap; gap: 4px 9px; margin-top: 3px; }
.changes-body .change-fields > span, .changes-body .change-relations > span { overflow-wrap: anywhere; }
.changes-body .change-relations { padding: 6px 0 2px; }
.changes-body .muted { color: var(--text-3); }
.changes-body .jump, .changes-body .more { padding: 0; border: 0; background: none; color: var(--text-2); font: inherit; text-decoration: underline; text-decoration-color: var(--border); text-underline-offset: 2px; cursor: pointer; }
.changes-body .jump:hover, .changes-body .more:hover { color: var(--text); background: none; text-decoration-color: currentColor; }
.changes-body .jump.k-added { color: var(--add); }
.changes-body .jump.k-modified { color: var(--mod); }
.changes-body .jump.k-removed { color: var(--del); }
.others { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.others .caption { color: var(--text-3); font-size: 12px; margin-right: 2px; }
.others button { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; font-size: 12px; }
.empty { color: var(--text-2); padding: 14px 2px; }
.status { color: var(--text-2); padding: 18px 2px; }
.status.error { color: var(--del); }
/* Simplified graph, drawn when Graph Studio's renderer is unavailable. */
.node { cursor: pointer; transition: opacity 0.15s; }
.node .frame { fill: var(--bg); stroke: var(--border); stroke-width: 1; }
.node.removed { opacity: 0.74; }
.node.context .frame { stroke-dasharray: 2 3; }
.node.selected .frame { stroke: var(--mod); stroke-width: 2; }
.node.selected.added .frame { stroke: var(--add); }
.node.selected.removed .frame { stroke: var(--del); stroke-dasharray: 5 4; }
.node text { fill: var(--text); font-family: var(--font); }
.node .title { font-size: 12.5px; font-weight: 600; }
.node.context .title { fill: var(--text-2); font-weight: 500; }
.node .tag { font-size: 10.5px; }
.node .tag.added { fill: var(--add); }
.node .tag.modified { fill: var(--mod); }
.node .tag.removed { fill: var(--del); }
.node .tag.unchanged { fill: var(--text-3); }
.node .field { font-size: 11.5px; }
.node .field.added { fill: var(--add); }
.node .field.modified { fill: var(--mod); }
.node .field.removed { fill: var(--del); text-decoration: line-through; }
.node .ftype { font-size: 10.5px; fill: var(--text-3); font-family: var(--mono); }
.node .mark { font-size: 11.5px; font-weight: 600; fill: var(--text-3); }
.node .mark.added { fill: var(--add); }
.node .mark.modified { fill: var(--mod); }
.node .mark.removed { fill: var(--del); }
.node .more, .node .links { font-size: 10.5px; fill: var(--text-3); }
.edge { fill: none; transition: opacity 0.15s; }
.edge.unchanged { stroke: var(--text-3); stroke-width: 1; opacity: 0.55; }
.edge.added { stroke: var(--add); stroke-width: 1.8; }
.edge.modified { stroke: var(--mod); stroke-width: 1.8; }
.edge.removed { stroke: var(--del); stroke-width: 1.8; stroke-dasharray: 6 4; }
.faded { opacity: 0.12 !important; }
.detail { margin-top: 10px; border: 1px solid var(--border-2); border-radius: var(--radius); padding: 10px 12px; background: var(--bg); }
.detail h2 { font-size: 13.5px; margin: 0; font-weight: 600; }
.detail .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.fields { width: 100%; border-collapse: collapse; margin-top: 8px; table-layout: fixed; }
.fields td { padding: 3px 6px 3px 0; vertical-align: top; border-top: 1px solid var(--border-2); overflow-wrap: anywhere; }
.fields td.m { width: 18px; font-weight: 600; color: var(--text-3); }
.fields td.n { width: 34%; }
.fields tr.focused { background: var(--bg-2); }
.mono { font-family: var(--mono); font-size: 12px; }
.k-added { color: var(--add) !important; }
.k-modified { color: var(--mod) !important; }
.k-removed { color: var(--del) !important; }
.was { color: var(--text-3); font-size: 12px; }
.defs { margin-top: 8px; }
.defs pre { margin: 2px 0 6px; white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--mono); font-size: 11.5px; color: var(--text-2); background: var(--bg-2); border-radius: 6px; padding: 5px 7px; }
[hidden] { display: none !important; }
</style>
</head>

<script>
(() => {
  "use strict";
  const SVG = "http://www.w3.org/2000/svg";
  const MARK = { added: "+", removed: "−", modified: "~", unchanged: "·" };
  const LABEL = { added: "New", removed: "Removed", modified: "Changed", unchanged: "Unchanged" };
  const KINDS = ["added", "modified", "removed"];
  const $ = (id) => document.getElementById(id);
  const kindOf = (kind) => (KINDS.includes(kind) ? kind : "unchanged");

  function el(tag, props, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(props || {})) {
      if (value === undefined || value === null || value === false) continue;
      if (key === "class") node.className = value;
      else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
      else node.setAttribute(key, value === true ? "" : String(value));
    }
    for (const child of children.flat()) {
      if (child === undefined || child === null || child === false) continue;
      node.appendChild(typeof child === "string" || typeof child === "number" ? document.createTextNode(String(child)) : child);
    }
    return node;
  }
  function svg(tag, attrs, parent, text) {
    const node = document.createElementNS(SVG, tag);
    for (const [key, value] of Object.entries(attrs || {})) node.setAttribute(key, String(value));
    if (text !== undefined) node.textContent = text;
    if (parent) parent.appendChild(node);
    return node;
  }
  const clip = (value, limit) => { const text = String(value ?? ""); return text.length > limit ? text.slice(0, limit - 1) + "…" : text; };

  // ---- MCP Apps protocol (view side) ----
  let nextID = 1;
  const pending = new Map();
  const post = (message) => window.parent.postMessage(message, "*");
  const notify = (method, params) => post({ jsonrpc: "2.0", method, params: params || {} });
  function request(method, params, timeout) {
    const id = nextID++;
    post({ jsonrpc: "2.0", id, method, params: params || {} });
    return new Promise((resolve, reject) => {
      pending.set(id, { resolve, reject });

    const variables = context.styles && context.styles.variables;
    if (variables && typeof variables === "object") {

    .catch(() => {})
    .finally(() => notify("ui/notifications/initialized"));

  function showStatus(text, isError) {

    $("view").hidden = true;
    requestAnimationFrame(reportSize);
  }
  function textOf(result) {
    return (Array.isArray(result.content) ? result.content : []).filter((item) => item && item.type === "text").map((item) => item.text).join("\n");
  }
  function handleResult(result) {
    const data = result.structuredContent;
    if (result.isError) {
      showStatus((data && data.error && data.error.message) || textOf(result) || "The review could not be shown.", true);
      return;
    }
    if (!data || data.format !== "sqlite-graph-studio/schema-review-view") {
      showStatus(textOf(result) || "This result has no schema review to show.");
      return;
    }
    render(data);
  }

  let toastTimer = 0;
  function toast(text, isError) {
    const box = $("toast");
    box.textContent = text;
    box.className = isError ? "toast error" : "toast";
    box.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { box.hidden = true; requestAnimationFrame(reportSize); }, isError ? 7000 : 3500);
    requestAnimationFrame(reportSize);
  }

  function render(model) {
    exact.reset();
    drag = null;
    $("canvas").classList.remove("panning");
    state.model = model;
    state.detail = null;
    state.detailError = null;
    state.tables = new Map();
    state.idSets = [];
    state.mode = null;
    state.focusTable = null;
    state.frameSelection = [];
    state.showGraphDetail = false;
    state.visibleSetKey = "";
    state.outlineAll = false;
    state.allRelations = false;
    state.expandedFields.clear();
    detailRequest = null;
    state.labels = Array.isArray(model.changeSets) ? model.changeSets : [];
    $("status").hidden = true;
    $("view").hidden = false;
    $("changes").open = false;

    const summary = model.summary || {};
    const legend = $("legend");
    legend.replaceChildren();
    const chip = (kind, text) => el("span", { class: "chip" }, el("span", { class: "dot " + kind }), text);
    if (summary.addedTables) legend.append(chip("added", summary.addedTables + " new"));
    if (summary.modifiedTables) legend.append(chip("modified", summary.modifiedTables + " changed"));
    if (summary.removedTables) legend.append(chip("removed", summary.removedTables + " removed"));

    const hasChanges = (summary.addedTables || 0) + (summary.modifiedTables || 0) + (summary.removedTables || 0) > 0;
    $("canvas").hidden = !hasChanges;
    $("empty").hidden = hasChanges;
    $("changes").hidden = !hasChanges;
    $("detail").hidden = true;
    setSets(state.labels.length + (model.moreChangeSets || 0), hasChanges ? 0 : null);

  }

  // ---- Connected change sets ----
  // Each set is changes joined by relations; one set is in view at a time. Previous and
  // Next move between sets, and the sets not connected to the one in view are listed.
  function setSets(count, current) {
    const previous = state.set;
    state.setCount = count;
    state.set = Number.isInteger(current) && current >= 0 && current < count ? current : null;
    $("sets").hidden = count <= 1;
    $("prev").disabled = state.set === 0;
    $("next").disabled = state.set !== null && state.set + 1 >= count;
    $("position").textContent = state.set === null ? `${count} sets of changes` : `Changes ${state.set + 1} of ${count}`;
    if (previous !== state.set) {

  }
  /// A set as the chips name it: its first table, its size, and one kind for all of it.
  function labelFor(ids) {
    const tables = ids.map((id) => state.tables.get(id)).filter(Boolean);
    const kinds = new Set(tables.map((table) => kindOf(table.kind)));
    return { label: tables.length ? tables[0].name : String(ids[0] || ""), tables: ids.length,
             kind: kinds.size === 1 ? [...kinds][0] : "modified", badge: tables.length === 1 ? tables[0].badge : undefined };
  }
  function renderOthers() {
    const box = $("others");
    box.replaceChildren();
    const others = state.labels.map((label, index) => ({ label, index })).filter((entry) => entry.index !== state.set);
    box.hidden = state.setCount <= 1 || !others.length;
    if (box.hidden) { requestAnimationFrame(reportSize); return; }
    box.append(el("span", { class: "caption" }, "All other changes"));
    for (const { label, index } of others) {
      const size = label.tables || 1;
      const title = size > 1 ? `${label.label} and ${size - 1} more connected ${size === 2 ? "table" : "tables"}` : label.label;
      box.append(el("button", { type: "button", title, onclick: () => showSet(index) },
        el("span", { class: "dot " + kindOf(label.kind) }),
        clip(label.label, 36) + (size > 1 ? ` +${size - 1}` : ""),
        label.badge ? el("span", { class: "badge" }, label.badge) : null));
    }
    if (state.setCount > state.labels.length) box.append(el("span", { class: "caption" }, `+${state.setCount - state.labels.length} more`));
    requestAnimationFrame(reportSize);
  }
  function step(direction) {

    if (target >= 0 && target < state.setCount) showSet(target);
  }

  }

      .then((result) => {
        const detail = result.structuredContent;
        if (!detail || detail.format !== "sqlite-graph-studio/schema-review-detail") throw new Error("The change details could not be read.");

      title: `${LABEL[kind]} ${fieldName ? "field " + fieldName + " in " : "table "}${tableName(tableID)}`,
      onclick: (event) => { event.preventDefault(); focusChange(tableID, fieldName); },

    else if (state.mode === simple) simple.select(tableID, fieldName, false);

        jumpLink(table.name, kind, table.id),

      const fields = (Array.isArray(table.columns) ? table.columns : []).filter((column) => kindOf(column.kind) !== "unchanged");
      if (fields.length) {

        const list = el("div", { class: "change-fields" });
        for (const column of (expanded ? fields : fields.slice(0, 8))) {
          const fieldKind = kindOf(column.kind);
          const description = column.before ? `${column.before} → ${column.description || "removed"}` : column.description || "";
          list.append(el("span", {}, jumpLink(`${MARK[fieldKind]} ${column.name}`, fieldKind, table.id, column.name),
            description ? el("span", { class: "muted" }, ` · ${clip(description, 80)}`) : null));
        }

          onclick: () => { state.expandedFields.add(table.id); renderChanges(); } }, `+${fields.length - 8} fields`));
        row.append(list);
      }
      const definitions = Array.isArray(table.definitionChanges) ? table.definitionChanges : [];
      if (definitions.length) row.append(el("div", { class: "muted" }, definitions.map((change) => `${MARK[kindOf(change.kind)]} ${change.label || "Definition"}`).join(" · ")));

    const omitted = Math.max(0, total - tables.length);

    const inView = new Set(ids);
    const relations = (Array.isArray(state.detail.relations) ? state.detail.relations : [])
      .filter((relation) => kindOf(relation.kind) !== "unchanged" && (inView.has(relation.source) || inView.has(relation.target)));
    if (relations.length) {
      const heading = el("div", { class: "muted" }, `${relations.length} ${relations.length === 1 ? "relation" : "relations"}`);
      const list = el("div", { class: "change-relations" });
      for (const relation of (state.allRelations ? relations : relations.slice(0, 16))) {
        const kind = kindOf(relation.kind);
        list.append(el("span", {}, `${MARK[kind]} `,
          jumpLink(tableName(relation.source), kind, relation.source),
          ` (${(relation.sourceColumns || []).join(", ")}) → `,
          jumpLink(tableName(relation.target), kind, relation.target),
          ` (${(relation.targetColumns || []).join(", ")})`));
      }
      body.append(heading, list);
      if (!state.allRelations && relations.length > 16) body.append(el("button", { type: "button", class: "more",
        onclick: () => { state.allRelations = true; renderChanges(); } }, `Show ${relations.length - 16} more relations`));

  // ---- Screen transforms: x ↦ s·x + t, batched for the renderer ----
  const IDENTITY = { s: 1, tx: 0, ty: 0 };

  const exact = (() => {

      inFlight = false;
      again = false;
      queued = [];
      local = IDENTITY;
      sent = IDENTITY;
      frameSize = null;
      failures = 0;
    }

    function start() {
      state.mode = exact;
      failures = 0;
      $("graph").toggleAttribute("hidden", true);
      $("loading").hidden = !!image;
      $("note").hidden = true;
      again = true;

    }
    function viewport() {
      const canvas = $("canvas");

    }
    function act(action) { queued.push(action); flush(); }
    function gesture(transform) {

      flush();
    }
    function refresh() { again = true; flush(); }

      }, 180);

      inFlight = true;

      const size = viewport();

      if (actions.length) args.actions = actions;

        .then(() => { if (requestGeneration === generation) failures = 0; })
        .catch((error) => {

      if (!content) throw new Error("The renderer returned no image.");

      sent = IDENTITY;

      $("loading").hidden = true;

      // The tool result leaves out the tables and fields the simplified graph draws.
      loadDetail()
        .then((detail) => {

        })
        .catch((detailError) => {

      pan: (dx, dy) => gesture(panBy(dx, dy)),
      zoom: (factor, point) => gesture(zoomAt(factor, point)),
      // The last frame stays still while its camera moves remotely. Map a click on
      // that visible frame to where the same point will be after pending gestures.
      click: (point) => act({ type: "click", x: local.s * point.x + local.tx, y: local.s * point.y + local.ty }),

  })();

  // ---- Simplified graph ----
  const simple = (() => {
    const NODE_WIDTH = 236, HEADER = 32, ROW = 18, GRAPH_ROWS = 7, GAP_X = 70, GAP_Y = 54;
    let nodes = new Map(), bounds = null, vb = null, selected = null, shown = [];

    function start(reason, detail) {
      state.mode = simple;
      state.detail = detail;
      state.tables = new Map((Array.isArray(detail.tables) ? detail.tables : []).map((table) => [table.id, table]));

      $("loading").hidden = true;
      const notDrawn = (detail.omitted || {}).changedTables || 0;
      $("note").hidden = false;
      $("note").textContent = notDrawn ? `Simplified view · ${notDrawn} changed tables not drawn` : "Simplified view";
      $("note").title = reason || "";
      showSet(state.idSets.length ? 0 : null);
      renderChanges();
    }
    function showSet(index) {
      const all = [...state.tables.values()];
      const members = index === null ? all.filter((table) => !table.context).map((table) => table.id) : state.idSets[index] || [];
      const keep = new Set(members);
      const relations = Array.isArray(state.detail.relations) ? state.detail.relations : [];
      // Related unchanged tables that the review draws come along with their set.
      for (const relation of relations) {
        for (const [near, far] of [[relation.source, relation.target], [relation.target, relation.source]]) {
          const other = state.tables.get(far);
          if (keep.has(near) && other && other.context) keep.add(far);
        }
      }
      shown = all.filter((table) => keep.has(table.id));
      selected = null;
      setSets(state.idSets.length, index);
      draw(shown, relations.filter((relation) => keep.has(relation.source) && keep.has(relation.target)));
      renderDetail(null);
      fit();
    }

    function layout(tables, relations) {
      const byID = new Map(tables.map((table) => [table.id, table]));
      const neighbors = new Map(tables.map((table) => [table.id, new Set()]));
      for (const relation of relations) {
        if (byID.has(relation.source) && byID.has(relation.target) && relation.source !== relation.target) {
          neighbors.get(relation.source).add(relation.target);
          neighbors.get(relation.target).add(relation.source);
        }
      }
      // Breadth-first from the most connected table, so a hub sits in the middle with its
      // neighbours around it.
      const degree = (id) => neighbors.get(id).size;
      const byDegree = (a, b) => degree(b) - degree(a) || (a < b ? -1 : a > b ? 1 : 0);
      const ordered = [];
      const seen = new Set();
      const starts = tables.filter((table) => !table.context).map((table) => table.id).sort(byDegree)
        .concat(tables.filter((table) => table.context).map((table) => table.id).sort());
      for (const first of starts) {
        if (seen.has(first)) continue;
        const queue = [first];
        seen.add(first);
        while (queue.length) {
          const id = queue.shift();
          ordered.push(byID.get(id));
          for (const next of [...neighbors.get(id)].sort(byDegree)) {
            if (!seen.has(next)) { seen.add(next); queue.push(next); }
          }
        }
      }
      const columns = Math.max(1, Math.min(ordered.length, Math.round(Math.sqrt(ordered.length * 1.9))));
      const rows = Math.ceil(ordered.length / columns);
      const cells = [];
      for (let row = 0; row < rows; row += 1) for (let column = 0; column < columns; column += 1) cells.push({ row, column });
      const middleRow = (rows - 1) / 2, middleColumn = (columns - 1) / 2;
      const distance = (cell) => Math.hypot((cell.row - middleRow) * 1.25, cell.column - middleColumn);
      cells.sort((a, b) => distance(a) - distance(b) || a.row - b.row || a.column - b.column);
      const heights = ordered.map((table) => nodeHeight(table));
      const rowHeights = new Array(rows).fill(0);
      ordered.forEach((table, index) => { rowHeights[cells[index].row] = Math.max(rowHeights[cells[index].row], heights[index]); });
      const rowTops = [];
      let y = 0;
      for (let row = 0; row < rows; row += 1) { rowTops.push(y); y += (rowHeights[row] || 0) + GAP_Y; }
      const placed = new Map();
      ordered.forEach((table, index) => {
        const cell = cells[index];
        placed.set(table.id, { x: cell.column * (NODE_WIDTH + GAP_X), y: rowTops[cell.row], width: NODE_WIDTH, height: heights[index], table });
      });
      return placed;
    }
    function summarizedLinks(table) {
      const links = table.unchangedLinks;
      return links && !links.drawn && links.relations > 0 ? links : null;
    }
    // Fields arrive in review order (keys, then changes); a card shows the first rows.
    const cardColumns = (table) => (Array.isArray(table.columns) ? table.columns : []).slice(0, GRAPH_ROWS);
    function hiddenCount(table) {
      const columns = Array.isArray(table.columns) ? table.columns : [];
      return columns.length - cardColumns(table).length + (table.hiddenColumns || 0);
    }
    function nodeHeight(table) {
      return HEADER + cardColumns(table).length * ROW + (hiddenCount(table) > 0 ? ROW : 0) + (summarizedLinks(table) ? ROW : 0) + 8;
    }

    function draw(tables, relations) {
      const graph = $("graph");
      graph.replaceChildren();
      const defs = svg("defs", {}, graph);
      for (const kind of ["added", "modified", "removed", "unchanged"]) {
        const marker = svg("marker", { id: "arrow-" + kind, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" }, defs);
        svg("path", { d: "M0,0 L10,5 L0,10 z", fill: kind === "unchanged" ? "var(--text-3)" : `var(--${kind === "added" ? "add" : kind === "modified" ? "mod" : "del"})` }, marker);
      }
      nodes = layout(tables, relations);
      const edgeLayer = svg("g", {}, graph);
      const nodeLayer = svg("g", {}, graph);
      const pairs = new Map();
      for (const relation of relations) {
        if (!nodes.has(relation.source) || !nodes.has(relation.target)) continue;
        const key = [relation.source, relation.target].sort().join("\u0000");
        if (!pairs.has(key)) pairs.set(key, []);
        pairs.get(key).push(relation);
      }
      for (const group of pairs.values()) {
        group.forEach((relation, index) => drawEdge(edgeLayer, relation, (index - (group.length - 1) / 2) * 9));
      }
      for (const node of nodes.values()) drawNode(nodeLayer, node);
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
      for (const node of nodes.values()) {
        minX = Math.min(minX, node.x); minY = Math.min(minY, node.y);
        maxX = Math.max(maxX, node.x + node.width); maxY = Math.max(maxY, node.y + node.height);
      }
      bounds = nodes.size ? { x: minX - 30, y: minY - 30, w: maxX - minX + 60, h: maxY - minY + 60 } : null;
    }
    const center = (node) => ({ x: node.x + node.width / 2, y: node.y + node.height / 2 });
    function border(node, toward) {
      const c = center(node);
      const dx = toward.x - c.x, dy = toward.y - c.y;
      if (dx === 0 && dy === 0) return c;
      const scale = Math.min(node.width / 2 / Math.abs(dx || 1e-9), node.height / 2 / Math.abs(dy || 1e-9));
      return { x: c.x + dx * scale, y: c.y + dy * scale };
    }
    function drawEdge(layer, relation, offset) {
      const source = nodes.get(relation.source), target = nodes.get(relation.target);
      const kind = kindOf(relation.kind);
      const g = svg("g", { class: "edge-group", "data-source": relation.source, "data-target": relation.target }, layer);
      let d;
      if (source === target) {
        const x = source.x + source.width, y = source.y + HEADER / 2;
        d = `M${x},${y} C${x + 46},${y - 30} ${x + 46},${y + 40} ${x},${y + 22}`;
      } else {
        const a = center(source), b = center(target);
        const length = Math.hypot(b.x - a.x, b.y - a.y) || 1;
        const nx = -(b.y - a.y) / length * offset, ny = (b.x - a.x) / length * offset;
        const from = border(source, { x: b.x + nx, y: b.y + ny });
        const to = border(target, { x: a.x + nx, y: a.y + ny });
        d = `M${from.x + nx},${from.y + ny} L${to.x + nx},${to.y + ny}`;
      }
      const path = svg("path", { class: "edge " + kind, d, "marker-end": `url(#arrow-${kind})` }, g);
      svg("title", {}, path, `${relation.source} (${(relation.sourceColumns || []).join(", ")}) → ${relation.target} (${(relation.targetColumns || []).join(", ")}) · ${LABEL[kind]}`);
    }
    function drawNode(layer, node) {
      const table = node.table;
      const kind = kindOf(table.kind);
      const classes = ["node", kind].concat(table.context ? ["context"] : []);
      const g = svg("g", { class: classes.join(" "), "data-id": table.id, tabindex: 0, role: "button", "aria-label": `${table.name}, ${table.context ? "related, unchanged" : LABEL[kind]}` }, layer);
      svg("rect", { class: "frame", x: node.x, y: node.y, width: node.width, height: node.height, rx: 8 }, g);
      svg("title", {}, g, table.name + (table.badge ? " · " + table.badge : ""));
      svg("text", { class: "title", x: node.x + 12, y: node.y + 21 }, g, clip(table.name, 23));
      const tag = table.context ? "Related" : (kind === "modified" ? (table.badge || "Changed") : LABEL[kind]);
      svg("text", { class: "tag " + kind, x: node.x + node.width - 12, y: node.y + 21, "text-anchor": "end" }, g, clip(tag, 12));
      const columns = cardColumns(table);
      columns.forEach((column, index) => {
        const y = node.y + HEADER + 12 + index * ROW;
        const columnKind = kindOf(column.kind);
        svg("text", { class: "mark " + columnKind, x: node.x + 12, y }, g, MARK[columnKind]);
        svg("text", { class: "field " + columnKind, x: node.x + 26, y }, g, clip(column.name, 20));
        const keys = (column.primaryKey ? "PK " : "") + (column.foreignKey ? "FK " : "");
        const type = String(column.description || "").split(" · ")[0];
        svg("text", { class: "ftype", x: node.x + node.width - 12, y, "text-anchor": "end" }, g, clip(keys + type, 16));
      });
      let footerRow = columns.length;
      const hidden = hiddenCount(table);
      if (hidden > 0) { svg("text", { class: "more", x: node.x + 26, y: node.y + HEADER + 12 + footerRow * ROW }, g, `+${hidden} more fields`); footerRow += 1; }
      const links = summarizedLinks(table);
      if (links) {
        const text = `↔ ${links.relations} unchanged ${links.relations === 1 ? "link" : "links"} · ${links.tables} ${links.tables === 1 ? "table" : "tables"}`;
        svg("text", { class: "links", x: node.x + 12, y: node.y + HEADER + 12 + footerRow * ROW }, g, text);
      }
      g.addEventListener("keydown", (event) => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); select(table.id); } });
    }

    function select(id, fieldName, toggle = true) {
      selected = id && nodes.has(id) && (!toggle || selected !== id) ? id : null;
      const keep = new Set(selected ? [selected] : []);
      if (selected) {
        for (const group of document.querySelectorAll(".edge-group")) {
          if (group.dataset.source === selected) keep.add(group.dataset.target);
          if (group.dataset.target === selected) keep.add(group.dataset.source);
        }
      }
      for (const node of document.querySelectorAll(".node")) {
        node.classList.toggle("selected", node.dataset.id === selected);
        node.classList.toggle("faded", !!selected && !keep.has(node.dataset.id));
      }
      for (const group of document.querySelectorAll(".edge-group")) {
        const touches = group.dataset.source === selected || group.dataset.target === selected;
        group.classList.toggle("faded", !!selected && !touches);
      }
      renderDetail(selected ? nodes.get(selected).table : null, fieldName);
    }

    function renderDetail(table, fieldName) {
      const detail = $("detail");
      detail.replaceChildren();
      if (!table) { detail.hidden = true; requestAnimationFrame(reportSize); return; }
      detail.hidden = false;
      const kind = kindOf(table.kind);
      detail.append(el("div", { class: "row" },
        el("h2", {}, table.name),
        el("span", { class: "badge" }, table.context ? "Related, unchanged" : LABEL[kind]),
        kind === "modified" && table.badge ? el("span", { class: "badge" }, table.badge) : null,
        table.objectKind && table.objectKind !== "table" ? el("span", { class: "badge" }, table.objectKind) : null));
      const rows = (Array.isArray(table.columns) ? table.columns : []).map((column) => {
        const columnKind = kindOf(column.kind);
        const keys = [column.primaryKey ? "PK" : null, column.foreignKey ? "FK" : null].filter(Boolean).join(" ");
        return el("tr", { class: fieldName === column.name ? "focused" : "" },
          el("td", { class: "m k-" + columnKind }, MARK[columnKind]),
          el("td", { class: "n" + (columnKind === "unchanged" ? "" : " k-" + columnKind) }, column.name, keys ? el("span", { class: "was" }, " " + keys) : null),
          el("td", { class: "mono" }, column.description || "", column.before ? el("div", { class: "was" }, "was " + column.before) : null));
      });
      if (rows.length) detail.append(el("table", { class: "fields" }, el("tbody", {}, rows)));
      if (table.hiddenColumns) detail.append(el("p", { class: "was" }, `${table.hiddenColumns} unchanged fields are not listed.`));
      const definitions = Array.isArray(table.definitionChanges) ? table.definitionChanges : [];
      if (definitions.length) {
        const box = el("div", { class: "defs" }, el("div", {}, "Definition changes"));
        for (const change of definitions) {
          const changeKind = KINDS.includes(change.kind) ? change.kind : "modified";
          box.append(el("div", { class: "k-" + changeKind }, `${MARK[changeKind]} ${change.label || change.key}`));
          if (change.before) box.append(el("pre", { class: change.after ? "" : "k-removed" }, (change.after ? "was: " : "") + change.before));
          if (change.after) box.append(el("pre", {}, change.after));
        }
        detail.append(box);
      }
      const links = summarizedLinks(table);
      if (links) {
        const box = el("div", { class: "defs" }, el("div", {}, `Unchanged links (${links.relations}, not drawn)`));
        for (const item of Array.isArray(links.items) ? links.items : []) {
          const columns = (item.columns || []).join(", ");
          box.append(el("div", { class: "was" }, item.direction === "referencedBy"
            ? `← ${item.name} (${columns}) references ${table.name}`
            : `→ ${table.name} references ${item.name} (${columns})`));
        }
        if (links.more) box.append(el("div", { class: "was" }, `+${links.more} more`));
        detail.append(box);
      }
      const relations = (state.detail && Array.isArray(state.detail.relations) ? state.detail.relations : []).filter((relation) => relation.source === table.id || relation.target === table.id);
      if (relations.length) {
        const box = el("div", { class: "defs" }, el("div", {}, "Relations"));
        for (const relation of relations) {
          const relationKind = kindOf(relation.kind);
          box.append(el("div", { class: relationKind === "unchanged" ? "" : "k-" + relationKind },
            `${MARK[relationKind]} ${tableName(relation.source)} (${(relation.sourceColumns || []).join(", ")}) → ${tableName(relation.target)} (${(relation.targetColumns || []).join(", ")})`));
          if (relation.previousDefinition) box.append(el("div", { class: "was" }, "was " + relation.previousDefinition));
        }
        detail.append(box);
      }
      requestAnimationFrame(reportSize);
    }

    function setViewBox(next) {
      vb = next;
      $("graph").setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
    }
    function aspect() {
      const canvas = $("canvas");
      return Math.max(0.2, (canvas.clientWidth || 600) / (canvas.clientHeight || 440));
    }
    function fit() {
      if (!bounds) return;
      const ratio = aspect();
      let w = Math.max(bounds.w, 420), h = Math.max(bounds.h, 260);
      if (w / h > ratio) h = w / ratio; else w = h * ratio;
      setViewBox({ x: bounds.x + bounds.w / 2 - w / 2, y: bounds.y + bounds.h / 2 - h / 2, w, h });
    }
    const unitsPerPixel = () => (vb ? vb.w / ($("canvas").clientWidth || 1) : 1);
    function pan(dx, dy) {
      if (!vb) return;
      const scale = unitsPerPixel();
      setViewBox({ ...vb, x: vb.x - dx * scale, y: vb.y - dy * scale });
    }
    function zoom(factor, point) {
      if (!vb) return;
      const limit = bounds ? Math.max(bounds.w, bounds.h) * 3 : 5000;
      const w = Math.min(Math.max(vb.w / factor, 160), limit);
      const applied = w / vb.w;
      const scale = unitsPerPixel();
      const anchor = { x: vb.x + point.x * scale, y: vb.y + point.y * scale };
      setViewBox({ x: anchor.x - (anchor.x - vb.x) * applied, y: anchor.y - (anchor.y - vb.y) * applied, w, h: vb.h * applied });
    }
    function click(point, target) {
      const node = target && target.closest ? target.closest(".node") : null;
      select(node ? node.dataset.id : null);
    }
    return { start, showSet, select, renderDetail, pan, zoom, click, fit, resized: fit };
  })();

  // ---- Input: the same gestures as Graph Studio's graph ----
  const canvas = $("canvas");
  function pointOf(event) {
    const rect = canvas.getBoundingClientRect();
    return { x: event.clientX - rect.left - canvas.clientLeft, y: event.clientY - rect.top - canvas.clientTop };
  }
  function centerPoint() { return { x: canvas.clientWidth / 2, y: canvas.clientHeight / 2 }; }
  canvas.addEventListener("wheel", (event) => {
    if (!state.mode) return;
    event.preventDefault();
    const point = pointOf(event);
    const lineScale = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? canvas.clientHeight : 1;
    const dx = event.deltaX * lineScale, dy = event.deltaY * lineScale;
    // Trackpads send fractional pixel deltas, or a wheelDelta of exactly three times the
    // delta; mouse wheels send whole notches.
    const wheelDelta = event.wheelDeltaY || event.wheelDeltaX || 0;
    const trackpad = event.deltaMode === 0 && (!Number.isInteger(event.deltaX) || !Number.isInteger(event.deltaY)
      || !wheelDelta || Math.abs(wheelDelta) === Math.abs(event.deltaY || event.deltaX) * 3);
    if (event.ctrlKey) {
      state.mode.zoom(Math.exp(-dy * 0.01), point);                      // pinch
    } else if (trackpad) {
      state.mode.pan(-dx, -dy);                                            // two fingers move the canvas
    } else if (Math.abs(dy) >= Math.abs(dx)) {
      // A mouse wheel zooms toward the pointer, about 15% a notch; sideways it pans.
      const notches = event.wheelDeltaY ? event.wheelDeltaY / 120 : event.deltaMode === 1 ? -event.deltaY / 3 : -dy / 100;
      state.mode.zoom(Math.exp(Math.max(-3, Math.min(3, notches)) * 0.15), point);
    } else {
      state.mode.pan(-dx, 0);
    }
  }, { passive: false });
  let lastScale = 1;
  canvas.addEventListener("gesturestart", (event) => { event.preventDefault(); lastScale = 1; });
  canvas.addEventListener("gesturechange", (event) => {
    event.preventDefault();
    if (!state.mode) return;
    state.mode.zoom(event.scale / lastScale, pointOf(event));
    lastScale = event.scale;
  });
  let drag = null;
  canvas.addEventListener("pointerdown", (event) => {
    if (event.button !== 0 || !state.mode || event.target.closest(".zoom")) return;
    drag = { x: event.clientX, y: event.clientY, moved: false, target: event.target, point: pointOf(event) };
    canvas.setPointerCapture(event.pointerId);
  });
  canvas.addEventListener("pointermove", (event) => {
    if (!drag || !state.mode) return;
    const dx = event.clientX - drag.x, dy = event.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) < 4) return;
    drag.moved = true;
    canvas.classList.add("panning");
    drag.x = event.clientX; drag.y = event.clientY;
    state.mode.pan(dx, dy);
  });
  const endDrag = (event) => {
    if (!drag) return;
    // The release can land past the last move event.
    if (drag.moved && event.type === "pointerup" && state.mode) state.mode.pan(event.clientX - drag.x, event.clientY - drag.y);
    const wasClick = !drag.moved, target = drag.target, point = drag.point;
    drag = null;
    canvas.classList.remove("panning");
    if (event.type === "pointerup" && wasClick && state.mode) state.mode.click(point, target);
  };
  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", endDrag);
  document.addEventListener("keydown", (event) => {
    if (!state.mode || event.target instanceof HTMLButtonElement) return;
    if (event.key === "ArrowDown" || event.key === "ArrowRight") { event.preventDefault(); step(1); }
    else if (event.key === "ArrowUp" || event.key === "ArrowLeft") { event.preventDefault(); step(-1); }
    else if (event.key === "+" || event.key === "=") state.mode.zoom(1.25, centerPoint());
    else if (event.key === "-") state.mode.zoom(0.8, centerPoint());
    else if (event.key === "0") state.mode.fit();
  });
  $("prev").addEventListener("click", () => step(-1));
  $("next").addEventListener("click", () => step(1));
  $("zoom-in").addEventListener("click", () => state.mode && state.mode.zoom(1.25, centerPoint()));
  $("zoom-out").addEventListener("click", () => state.mode && state.mode.zoom(0.8, centerPoint()));
  $("fit").addEventListener("click", () => state.mode && state.mode.fit());
  $("open-app").addEventListener("click", () => {
    if (!state.model || !state.model.path) return;
    const button = $("open-app");
    button.disabled = true;
    callTool("studio_open_review_in_app", { path: state.model.path }, 20000)
      .then(() => toast("Sent to Graph Studio. Check the app for both tabs."))
      .catch((error) => toast(error && error.message ? error.message : "Graph Studio could not open the review.", true))
      .finally(() => { button.disabled = false; });
  });

  function sizeCanvas() {
    const width = canvas.clientWidth || 640;
    canvas.style.height = Math.round(Math.min(520, Math.max(340, width * 0.64))) + "px";
  }
  let lastWidth = 0;
  new ResizeObserver(() => {
    if (!state.mode || canvas.clientWidth === lastWidth) return;
    lastWidth = canvas.clientWidth;
    sizeCanvas();
    state.mode.resized();
  }).observe(canvas);
})();
</script>
</body>
</html>
