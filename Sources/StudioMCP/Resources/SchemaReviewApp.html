<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schema review</title>
<style>
:root {
  color-scheme: light dark;
  --fb-bg: #ffffff; --fb-bg-2: #f6f5f1; --fb-text: #1f1e1c; --fb-text-2: #5f5e5a; --fb-text-3: #8a8983;
  --fb-border: rgba(31, 30, 28, 0.16); --fb-border-2: rgba(31, 30, 28, 0.08);
  --add: #2563eb; --add-bg: rgba(37, 99, 235, 0.09); --del: #dc2626; --del-bg: rgba(220, 38, 38, 0.08);
  --warn: #92400e; --warn-bg: rgba(245, 158, 11, 0.16);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fb-bg: #1f1f1e; --fb-bg-2: #262624; --fb-text: #f2f1ed; --fb-text-2: #b7b5ad; --fb-text-3: #8f8d86;
    --fb-border: rgba(242, 241, 237, 0.18); --fb-border-2: rgba(242, 241, 237, 0.09);
    --add: #7aa7ff; --add-bg: rgba(122, 167, 255, 0.13); --del: #f38b8b; --del-bg: rgba(243, 139, 139, 0.12);
    --warn: #f7c56b; --warn-bg: rgba(247, 197, 107, 0.14);
  }
}
:root[data-theme="dark"] {
  --fb-bg: #1f1f1e; --fb-bg-2: #262624; --fb-text: #f2f1ed; --fb-text-2: #b7b5ad; --fb-text-3: #8f8d86;
  --fb-border: rgba(242, 241, 237, 0.18); --fb-border-2: rgba(242, 241, 237, 0.09);
  --add: #7aa7ff; --add-bg: rgba(122, 167, 255, 0.13); --del: #f38b8b; --del-bg: rgba(243, 139, 139, 0.12);
  --warn: #f7c56b; --warn-bg: rgba(247, 197, 107, 0.14);
}
:root {
  --bg: var(--color-background-primary, var(--fb-bg));
  --bg-2: var(--color-background-secondary, var(--fb-bg-2));
  --text: var(--color-text-primary, var(--fb-text));
  --text-2: var(--color-text-secondary, var(--fb-text-2));
  --text-3: var(--color-text-tertiary, var(--fb-text-3));
  --border: var(--color-border-primary, var(--fb-border));
  --border-2: var(--color-border-secondary, var(--fb-border-2));
  --font: var(--font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif);
  --mono: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
  --radius: var(--border-radius-md, 8px);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: transparent; color: var(--text); font-family: var(--font); font-size: 13px; line-height: 1.45; }
body { padding: 12px 14px 14px; }
h1 { font-size: 15px; font-weight: 600; margin: 0; }
button { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 4px 10px; cursor: pointer; }
button:hover { background: var(--bg-2); }
button:focus-visible, .node:focus-visible { outline: 2px solid var(--add); outline-offset: 2px; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.meta { color: var(--text-2); margin-top: 2px; }
.mono { font-family: var(--mono); font-size: 12px; }
.badge { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--bg-2); color: var(--text-2); white-space: nowrap; }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
.chips { margin: 10px 0 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); }
.dot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
.dot.added, .dot.modified { border: 2px solid var(--add); }
.dot.removed { border: 2px dashed var(--del); }
.dot.unchanged { border: 1px solid var(--border); }
.toolbar { margin: 4px 0 8px; }
.toolbar .spacer { flex: 1; }
.hint { color: var(--text-3); font-size: 12px; }
.canvas { position: relative; height: 440px; border: 1px solid var(--border-2); border-radius: var(--radius); background: var(--bg-2); overflow: hidden; touch-action: none; cursor: grab; }
.canvas.panning { cursor: grabbing; }
svg { display: block; width: 100%; height: 100%; user-select: none; -webkit-user-select: none; }
.node { cursor: pointer; transition: opacity 0.15s; }
.node .frame { fill: var(--bg); stroke: var(--border); stroke-width: 1; }
.node .inner { fill: none; stroke-width: 2; }
.node.added .inner, .node.modified .inner { stroke: var(--add); }
.node.removed .inner { stroke: var(--del); stroke-dasharray: 5 4; }
.node.removed { opacity: 0.74; }
.node.context .frame { stroke-dasharray: 2 3; }
.node.selected .frame { stroke: var(--text-2); stroke-width: 1.5; }
.node text { fill: var(--text); font-family: var(--font); }
.node .title { font-size: 12.5px; font-weight: 600; }
.node.context .title { fill: var(--text-2); font-weight: 500; }
.node .tag { font-size: 10.5px; }
.node .tag.added, .node .tag.modified { fill: var(--add); }
.node .tag.removed { fill: var(--del); }
.node .tag.unchanged { fill: var(--text-3); }
.node .field { font-size: 11.5px; }
.node .ftype { font-size: 10.5px; fill: var(--text-3); font-family: var(--mono); }
.node .mark { font-size: 11.5px; font-weight: 600; fill: var(--text-3); }
.node .mark.added, .node .mark.modified { fill: var(--add); }
.node .mark.removed { fill: var(--del); }
.node .field.removed { text-decoration: line-through; fill: var(--text-2); }
.node .more { font-size: 10.5px; fill: var(--text-3); }
.node .links { font-size: 10.5px; fill: var(--text-2); }
.edge { fill: none; transition: opacity 0.15s; }
.edge.unchanged { stroke: var(--text-3); stroke-width: 1; opacity: 0.55; display: none; }
svg.show-unchanged .edge.unchanged, .edge-group.touching .edge.unchanged { display: inline; }
.groups { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; margin: 8px 0 2px; }
.groups button { text-align: left; }
.edge.added { stroke: var(--add); stroke-width: 1.8; }
.edge.removed { stroke: var(--del); stroke-width: 1.8; stroke-dasharray: 6 4; }
.faded { opacity: 0.12 !important; }
.detail { margin-top: 10px; border: 1px solid var(--border-2); border-radius: var(--radius); padding: 10px 12px; background: var(--bg); }
.detail h2 { font-size: 13.5px; margin: 0; font-weight: 600; }
.fields { width: 100%; border-collapse: collapse; margin-top: 8px; table-layout: fixed; }
.fields td { padding: 3px 6px 3px 0; vertical-align: top; border-top: 1px solid var(--border-2); overflow-wrap: anywhere; }
.fields td.m { width: 18px; font-weight: 600; color: var(--text-3); }
.fields td.n { width: 34%; }
.k-added { color: var(--add) !important; }
.k-removed { color: var(--del) !important; }
.k-modified { color: var(--add) !important; }
.was { color: var(--text-3); font-size: 12px; }
.defs { margin-top: 8px; }
.defs pre { margin: 2px 0 6px; white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--mono); font-size: 11.5px; color: var(--text-2); background: var(--bg-2); border-radius: 6px; padding: 5px 7px; }
.list { margin-top: 10px; }
.list summary { cursor: pointer; color: var(--text-2); }
.list .items { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.list button { display: inline-flex; gap: 6px; align-items: center; padding: 3px 9px; }
.list button[aria-pressed="true"] { border-color: var(--text-2); background: var(--bg-2); }
.footer { margin-top: 10px; color: var(--text-3); font-size: 12px; }
.footer p { margin: 3px 0; }
.status { color: var(--text-2); padding: 18px 2px; }
.status.error { color: var(--del); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div id="status" class="status">Waiting for the review…</div>
<main id="view" hidden>
  <header>
    <div class="row"><h1 id="title"></h1><span id="artifact" class="badge warn" hidden>Proposed · not applied</span></div>
    <div id="meta" class="meta"></div>
    <div id="chips" class="row chips"></div>
  </header>
  <div id="toolbar" class="row toolbar">
    <button id="prev" type="button" aria-label="Previous change">‹ Previous</button>
    <button id="next" type="button" aria-label="Next change">Next ›</button>
    <span id="position" class="hint"></span>
    <span class="spacer"></span>
    <span class="hint">⌘ + scroll to zoom · drag to pan</span>
    <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
    <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
    <button id="fit" type="button">Fit</button>
    <button id="expand" type="button" hidden>Expand</button>
  </div>
  <div id="canvas" class="canvas" tabindex="0" aria-label="Schema change graph">
    <svg id="graph" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Changed tables and their relations"></svg>
  </div>
  <section id="detail" class="detail" hidden></section>
  <section id="list" class="list"></section>
  <div id="footer" class="footer"></div>
</main>
<script>
(() => {
  "use strict";
  const SVG = "http://www.w3.org/2000/svg";
  const NODE_WIDTH = 236, HEADER = 32, ROW = 18, GRAPH_ROWS = 8, GAP_X = 70, GAP_Y = 54;
  const MARK = { added: "+", removed: "−", modified: "~", unchanged: "·" };
  const LABEL = { added: "New", removed: "Removed", modified: "Changed", unchanged: "Unchanged" };
  const $ = (id) => document.getElementById(id);

  function el(tag, props, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(props || {})) {
      if (value === undefined || value === null || value === false) continue;
      if (key === "class") node.className = value;
      else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
      else node.setAttribute(key, value === true ? "" : String(value));
    }
    for (const child of children.flat()) {
      if (child === undefined || child === null || child === false) continue;
      node.appendChild(typeof child === "string" || typeof child === "number" ? document.createTextNode(String(child)) : child);
    }
    return node;
  }
  function svg(tag, attrs, parent, text) {
    const node = document.createElementNS(SVG, tag);
    for (const [key, value] of Object.entries(attrs || {})) node.setAttribute(key, String(value));
    if (text !== undefined) node.textContent = text;
    if (parent) parent.appendChild(node);
    return node;
  }
  const clip = (value, limit) => { const text = String(value ?? ""); return text.length > limit ? text.slice(0, limit - 1) + "…" : text; };

  // ---- MCP Apps protocol (view side) ----
  let nextID = 1;
  const pending = new Map();
  const post = (message) => window.parent.postMessage(message, "*");
  const notify = (method, params) => post({ jsonrpc: "2.0", method, params: params || {} });
  function request(method, params) {
    const id = nextID++;
    post({ jsonrpc: "2.0", id, method, params: params || {} });
    return new Promise((resolve, reject) => {
      pending.set(id, { resolve, reject });
      setTimeout(() => { if (pending.delete(id)) reject(new Error(method + " timed out")); }, 15000);
    });
  }
  window.addEventListener("message", (event) => {
    if (event.source !== window.parent) return;
    const message = event.data;
    if (!message || message.jsonrpc !== "2.0") return;
    if (message.id !== undefined && message.method === undefined) {
      const waiting = pending.get(message.id);
      if (waiting) { pending.delete(message.id); message.error ? waiting.reject(message.error) : waiting.resolve(message.result); }
      return;
    }
    switch (message.method) {
      case "ui/notifications/tool-input": showStatus("Loading the review…"); break;
      case "ui/notifications/tool-result": handleResult(message.params || {}); break;
      case "ui/notifications/tool-cancelled": showStatus("The review request was cancelled."); break;
      case "ui/notifications/host-context-changed": applyHostContext(message.params); break;
      case "ui/resource-teardown": case "ping":
        if (message.id !== undefined) post({ jsonrpc: "2.0", id: message.id, result: {} });
        break;
      default:
        if (message.id !== undefined) post({ jsonrpc: "2.0", id: message.id, error: { code: -32601, message: "Method not found" } });
    }
  });

  const state = { model: null, nodes: new Map(), order: [], selected: null, vb: null, bounds: null, displayMode: "inline", modes: [], hostHeight: null };

  function applyHostContext(context) {
    if (!context || typeof context !== "object") return;
    if (context.theme === "light" || context.theme === "dark") document.documentElement.dataset.theme = context.theme;
    const variables = context.styles && context.styles.variables;
    if (variables && typeof variables === "object") {
      for (const [key, value] of Object.entries(variables)) {
        if (key.startsWith("--") && typeof value === "string") document.documentElement.style.setProperty(key, value);
      }
    }
    if (Array.isArray(context.availableDisplayModes)) state.modes = context.availableDisplayModes;
    if (typeof context.displayMode === "string") state.displayMode = context.displayMode;
    const dimensions = context.containerDimensions;
    if (dimensions && typeof dimensions.height === "number") state.hostHeight = dimensions.height;
    updateExpandButton();
    sizeCanvas();
  }

  request("ui/initialize", {
    protocolVersion: "2026-01-26",
    clientInfo: { name: "SQLite Graph Studio schema review", version: "1.0.0" },
    appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] },
  }).then((result) => applyHostContext(result && result.hostContext))
    .catch(() => {})
    .finally(() => notify("ui/notifications/initialized"));

  let lastSize = "";
  function reportSize() {
    const width = Math.ceil(document.documentElement.scrollWidth);
    const height = Math.ceil(document.documentElement.scrollHeight);
    const key = width + "x" + height;
    if (key === lastSize) return;
    lastSize = key;
    notify("ui/notifications/size-changed", { width, height });
  }
  new ResizeObserver(() => requestAnimationFrame(reportSize)).observe(document.body);

  // ---- Results ----
  function showStatus(text, isError) {
    const status = $("status");
    status.textContent = text;
    status.className = isError ? "status error" : "status";
    status.hidden = false;
    $("view").hidden = true;
    requestAnimationFrame(reportSize);
  }
  function textOf(result) {
    return (Array.isArray(result.content) ? result.content : []).filter((item) => item && item.type === "text").map((item) => item.text).join("\n");
  }
  function handleResult(result) {
    const data = result.structuredContent;
    if (result.isError) {
      showStatus((data && data.error && data.error.message) || textOf(result) || "The review could not be shown.", true);
      return;
    }
    if (!data || data.format !== "sqlite-graph-studio/schema-review-view") {
      showStatus(textOf(result) || "This result has no schema review to show.");
      return;
    }
    render(data);
  }

  // ---- Rendering ----
  function render(model) {
    state.model = model;
    state.selected = null;
    const summary = model.summary || {};
    $("status").hidden = true;
    $("view").hidden = false;
    $("title").textContent = model.title || "Database changes";
    $("artifact").hidden = model.artifact !== "proposal";

    const meta = $("meta");
    meta.replaceChildren();
    const refs = model.artifact === "proposal"
      ? [el("span", {}, "Based on "), el("span", { class: "mono" }, clip(model.baseRef, 60))]
      : [el("span", { class: "mono" }, clip(model.baseRef, 40)), el("span", {}, " → "), el("span", { class: "mono" }, clip(model.headRef, 40))];
    meta.append(...refs);
    if (model.author) meta.append(el("span", {}, " · " + model.author));
    if (model.engine) meta.append(el("span", {}, " · " + (model.engine === "postgresql" ? "PostgreSQL" : "SQLite")));

    const chips = $("chips");
    chips.replaceChildren();
    const chip = (kind, text) => el("span", { class: "chip" }, el("span", { class: "dot " + kind }), text);
    if (summary.addedTables) chips.append(chip("added", summary.addedTables + " new"));
    if (summary.removedTables) chips.append(chip("removed", summary.removedTables + " removed"));
    if (summary.modifiedTables) chips.append(chip("modified", summary.modifiedTables + " changed"));
    const relationCount = (summary.addedRelations || 0) + (summary.removedRelations || 0);
    if (relationCount) chips.append(chip("unchanged", "↔ " + (summary.addedRelations || 0) + " relations added, " + (summary.removedRelations || 0) + " removed"));
    chips.append(chip("unchanged", (summary.unchangedTables || 0) + " tables unchanged"));

    const tables = Array.isArray(model.tables) ? model.tables : [];
    state.order = tables.filter((table) => !table.context).map((table) => table.id);
    const hasGraph = tables.length > 0;
    $("toolbar").hidden = !hasGraph;
    $("canvas").hidden = !hasGraph;
    $("detail").hidden = true;
    if (hasGraph) drawGraph(tables, Array.isArray(model.relations) ? model.relations : []);
    renderList(tables);
    renderFooter(model);
    updatePosition();
    updateExpandButton();
    sizeCanvas();
    fit(false);
    requestAnimationFrame(reportSize);
  }

  function layout(tables, relations) {
    const byID = new Map(tables.map((table) => [table.id, table]));
    const neighbors = new Map(tables.map((table) => [table.id, new Set()]));
    for (const relation of relations) {
      if (byID.has(relation.source) && byID.has(relation.target) && relation.source !== relation.target) {
        neighbors.get(relation.source).add(relation.target);
        neighbors.get(relation.target).add(relation.source);
      }
    }
    // Breadth-first from the most connected table, so a hub comes first and its
    // neighbours right after it; related tables then land near each other.
    const degree = (id) => neighbors.get(id).size;
    const byDegree = (a, b) => degree(b) - degree(a) || (a < b ? -1 : a > b ? 1 : 0);
    const ordered = [];
    const seen = new Set();
    const starts = tables.filter((table) => !table.context).map((table) => table.id).sort(byDegree)
      .concat(tables.filter((table) => table.context).map((table) => table.id).sort());
    for (const start of starts) {
      if (seen.has(start)) continue;
      const queue = [start];
      seen.add(start);
      while (queue.length) {
        const id = queue.shift();
        ordered.push(byID.get(id));
        for (const next of [...neighbors.get(id)].sort(byDegree)) {
          if (!seen.has(next)) { seen.add(next); queue.push(next); }
        }
      }
    }
    // Fill grid cells from the centre outwards: the hub sits in the middle with its
    // neighbours around it instead of trailing off from a corner.
    const columns = Math.max(1, Math.min(ordered.length, Math.round(Math.sqrt(ordered.length * 1.9))));
    const rows = Math.ceil(ordered.length / columns);
    const cells = [];
    for (let row = 0; row < rows; row += 1) for (let column = 0; column < columns; column += 1) cells.push({ row, column });
    const middleRow = (rows - 1) / 2, middleColumn = (columns - 1) / 2;
    const distance = (cell) => Math.hypot((cell.row - middleRow) * 1.25, cell.column - middleColumn);
    cells.sort((a, b) => distance(a) - distance(b) || a.row - b.row || a.column - b.column);
    const heights = ordered.map((table) => nodeHeight(table));
    const rowHeights = new Array(rows).fill(0);
    ordered.forEach((table, index) => { rowHeights[cells[index].row] = Math.max(rowHeights[cells[index].row], heights[index]); });
    const rowTops = [];
    let y = 0;
    for (let row = 0; row < rows; row += 1) { rowTops.push(y); y += (rowHeights[row] || 0) + GAP_Y; }
    const placed = new Map();
    ordered.forEach((table, index) => {
      const cell = cells[index];
      placed.set(table.id, { x: cell.column * (NODE_WIDTH + GAP_X), y: rowTops[cell.row], width: NODE_WIDTH, height: heights[index], table });
    });
    return placed;
  }
  /// The fields a graph box has room for: changed fields and keys first, then the
  /// rest in order, shown in the table's own field order.
  function graphColumns(columns) {
    if (columns.length <= GRAPH_ROWS) return columns;
    const rank = (column) => (column.kind && column.kind !== "unchanged" ? 0 : column.primaryKey ? 1 : 2);
    const picked = new Set(columns.map((column, index) => ({ column, index }))
      .sort((a, b) => rank(a.column) - rank(b.column) || a.index - b.index)
      .slice(0, GRAPH_ROWS).map((entry) => entry.index));
    return columns.filter((_, index) => picked.has(index));
  }
  function summarizedLinks(table) {
    const links = table.unchangedLinks;
    return links && !links.drawn && links.relations > 0 ? links : null;
  }
  function nodeHeight(table) {
    const columns = Array.isArray(table.columns) ? table.columns : [];
    const shown = Math.min(columns.length, GRAPH_ROWS);
    const hidden = columns.length - shown + (table.hiddenColumns || 0);
    return HEADER + shown * ROW + (hidden > 0 ? ROW : 0) + (summarizedLinks(table) ? ROW : 0) + 8;
  }

  function drawGraph(tables, relations) {
    const graph = $("graph");
    graph.replaceChildren();
    const defs = svg("defs", {}, graph);
    for (const kind of ["added", "removed", "unchanged"]) {
      const marker = svg("marker", { id: "arrow-" + kind, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" }, defs);
      svg("path", { d: "M0,0 L10,5 L0,10 z", fill: kind === "added" ? "var(--add)" : kind === "removed" ? "var(--del)" : "var(--text-3)" }, marker);
    }
    const placed = layout(tables, relations);
    state.nodes = placed;
    const edgeLayer = svg("g", {}, graph);
    const nodeLayer = svg("g", {}, graph);

    const pairs = new Map();
    for (const relation of relations) {
      if (!placed.has(relation.source) || !placed.has(relation.target)) continue;
      const key = [relation.source, relation.target].sort().join("\u0000");
      if (!pairs.has(key)) pairs.set(key, []);
      pairs.get(key).push(relation);
    }
    for (const group of pairs.values()) {
      group.forEach((relation, index) => drawEdge(edgeLayer, placed, relation, (index - (group.length - 1) / 2) * 9));
    }
    for (const node of placed.values()) drawNode(nodeLayer, node);

    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const node of placed.values()) {
      minX = Math.min(minX, node.x); minY = Math.min(minY, node.y);
      maxX = Math.max(maxX, node.x + node.width); maxY = Math.max(maxY, node.y + node.height);
    }
    state.bounds = { x: minX - 30, y: minY - 30, w: maxX - minX + 60, h: maxY - minY + 60 };
  }

  function center(node) { return { x: node.x + node.width / 2, y: node.y + node.height / 2 }; }
  function border(node, toward) {
    const c = center(node);
    const dx = toward.x - c.x, dy = toward.y - c.y;
    if (dx === 0 && dy === 0) return c;
    const scale = Math.min(node.width / 2 / Math.abs(dx || 1e-9), node.height / 2 / Math.abs(dy || 1e-9));
    return { x: c.x + dx * scale, y: c.y + dy * scale };
  }
  function drawEdge(layer, placed, relation, offset) {
    const source = placed.get(relation.source), target = placed.get(relation.target);
    const kind = ["added", "removed"].includes(relation.kind) ? relation.kind : "unchanged";
    const g = svg("g", { class: "edge-group", "data-source": relation.source, "data-target": relation.target, "data-kind": kind }, layer);
    let d;
    if (source === target) {
      const x = source.x + source.width, y = source.y + HEADER / 2;
      d = `M${x},${y} C${x + 46},${y - 30} ${x + 46},${y + 40} ${x},${y + 22}`;
    } else {
      const a = center(source), b = center(target);
      const length = Math.hypot(b.x - a.x, b.y - a.y) || 1;
      const nx = -(b.y - a.y) / length * offset, ny = (b.x - a.x) / length * offset;
      const start = border(source, { x: b.x + nx, y: b.y + ny });
      const end = border(target, { x: a.x + nx, y: a.y + ny });
      d = `M${start.x + nx},${start.y + ny} L${end.x + nx},${end.y + ny}`;
    }
    const path = svg("path", { class: "edge " + kind, d, "marker-end": `url(#arrow-${kind})` }, g);
    svg("title", {}, path, `${relation.source} (${(relation.sourceColumns || []).join(", ")}) → ${relation.target} (${(relation.targetColumns || []).join(", ")}) · ${LABEL[kind]}`);
  }

  function drawNode(layer, node) {
    const table = node.table;
    const kind = LABEL[table.kind] ? table.kind : "unchanged";
    const classes = ["node", kind];
    if (table.context) classes.push("context");
    const g = svg("g", { class: classes.join(" "), "data-id": table.id, tabindex: 0, role: "button", "aria-label": `${table.name}, ${table.context ? "related, unchanged" : LABEL[kind]}` }, layer);
    svg("rect", { class: "frame", x: node.x, y: node.y, width: node.width, height: node.height, rx: 8 }, g);
    if (kind !== "unchanged") svg("rect", { class: "inner", x: node.x + 3, y: node.y + 3, width: node.width - 6, height: node.height - 6, rx: 6 }, g);
    svg("title", {}, g, table.name + (table.badge ? " · " + table.badge : ""));
    svg("text", { class: "title", x: node.x + 12, y: node.y + 21 }, g, clip(table.name, 23));
    const tag = table.context ? "Related" : (kind === "modified" ? (table.badge || "Changed") : LABEL[kind]);
    svg("text", { class: "tag " + kind, x: node.x + node.width - 12, y: node.y + 21, "text-anchor": "end" }, g, clip(tag, 12));
    const columns = Array.isArray(table.columns) ? table.columns : [];
    graphColumns(columns).forEach((column, index) => {
      const y = node.y + HEADER + 12 + index * ROW;
      const columnKind = LABEL[column.kind] ? column.kind : "unchanged";
      svg("text", { class: "mark " + columnKind, x: node.x + 12, y }, g, MARK[columnKind]);
      svg("text", { class: "field " + columnKind, x: node.x + 26, y }, g, clip(column.name, 20));
      const type = String(column.description || "").split(" · ")[0];
      svg("text", { class: "ftype", x: node.x + node.width - 12, y, "text-anchor": "end" }, g, clip((column.primaryKey ? "PK " : "") + type, 15));
    });
    const hidden = columns.length - Math.min(columns.length, GRAPH_ROWS) + (table.hiddenColumns || 0);
    let footerRow = Math.min(columns.length, GRAPH_ROWS);
    if (hidden > 0) { svg("text", { class: "more", x: node.x + 26, y: node.y + HEADER + 12 + footerRow * ROW }, g, `+${hidden} more fields`); footerRow += 1; }
    const links = summarizedLinks(table);
    if (links) {
      const text = `↔ ${links.relations} unchanged ${links.relations === 1 ? "link" : "links"} · ${links.tables} ${links.tables === 1 ? "table" : "tables"}`;
      svg("text", { class: "links", x: node.x + 12, y: node.y + HEADER + 12 + footerRow * ROW }, g, text);
    }
    g.addEventListener("keydown", (event) => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); select(table.id, true); } });
  }

  function renderList(tables) {
    const list = $("list");
    list.replaceChildren();
    const changed = tables.filter((table) => !table.context);
    if (!changed.length) {
      list.append(el("p", { class: "status" }, "No table, field, or relation changes."));
      return;
    }
    const groups = Array.isArray(state.model.changeGroups) ? state.model.changeGroups : [];
    if (groups.length) {
      const box = el("div", { class: "groups" }, el("div", { class: "hint" }, "Shared changes"));
      groups.forEach((group, index) => box.append(el("button", { type: "button", "data-group": index, "aria-pressed": "false", onclick: () => selectGroup(index) },
        el("span", { class: "badge" }, `${group.count} tables`), group.summary)));
      list.append(box);
    }
    const details = el("details", changed.length <= 12 ? { open: true } : {});
    details.append(el("summary", {}, `All changes (${changed.length})`));
    const items = el("div", { class: "items" });
    for (const table of changed) {
      items.append(el("button", { type: "button", "data-id": table.id, "aria-pressed": "false", onclick: () => select(table.id, true) },
        el("span", { class: "dot " + table.kind }), table.name, el("span", { class: "badge" }, table.badge || LABEL[table.kind])));
    }
    details.append(items);
    list.append(details);
  }

  function renderFooter(model) {
    const footer = $("footer");
    footer.replaceChildren();
    for (const note of (Array.isArray(model.notes) ? model.notes : []).slice(0, 20)) footer.append(el("p", {}, note));
    const omitted = model.omitted || {};
    if (omitted.changedTables) footer.append(el("p", {}, `${omitted.changedTables} more changed tables are not shown here. Open the file in Graph Studio to see every change.`));
    if (omitted.relatedTables) footer.append(el("p", {}, `${omitted.relatedTables} related unchanged tables are summarized on the changed tables instead of drawn. Select a changed table to list them.`));
    footer.append(el("p", {}, "Schema evidence only: row data, grants, and deployment effects are not part of this review."));
    if (model.path) footer.append(el("p", { class: "mono" }, model.path));
  }

  function renderDetail(table) {
    const detail = $("detail");
    detail.replaceChildren();
    if (!table) { detail.hidden = true; requestAnimationFrame(reportSize); return; }
    detail.hidden = false;
    const kind = LABEL[table.kind] ? table.kind : "unchanged";
    detail.append(el("div", { class: "row" },
      el("h2", {}, table.name),
      el("span", { class: "badge" }, table.context ? "Related, unchanged" : LABEL[kind]),
      table.kind === "modified" && table.badge ? el("span", { class: "badge" }, table.badge) : null,
      table.objectKind && table.objectKind !== "table" ? el("span", { class: "badge" }, table.objectKind) : null));
    const rows = (Array.isArray(table.columns) ? table.columns : []).map((column) => {
      const columnKind = LABEL[column.kind] ? column.kind : "unchanged";
      return el("tr", {},
        el("td", { class: "m k-" + columnKind }, MARK[columnKind]),
        el("td", { class: "n" + (columnKind === "unchanged" ? "" : " k-" + columnKind) }, column.name),
        el("td", { class: "mono" }, column.description || "", column.before ? el("div", { class: "was" }, "was " + column.before) : null));
    });
    if (rows.length) detail.append(el("table", { class: "fields" }, el("tbody", {}, rows)));
    if (table.hiddenColumns) detail.append(el("p", { class: "was" }, `${table.hiddenColumns} unchanged fields are not listed.`));
    const definitions = Array.isArray(table.definitionChanges) ? table.definitionChanges : [];
    if (definitions.length) {
      const box = el("div", { class: "defs" }, el("div", {}, "Definition changes"));
      for (const change of definitions) {
        const changeKind = LABEL[change.kind] ? change.kind : "modified";
        box.append(el("div", { class: "k-" + changeKind }, `${MARK[changeKind]} ${change.label || change.key}`));
        if (change.before) box.append(el("pre", {}, (change.after ? "was: " : "") + change.before));
        if (change.after) box.append(el("pre", {}, change.after));
      }
      detail.append(box);
    }
    const links = summarizedLinks(table);
    if (links) {
      const box = el("div", { class: "defs" }, el("div", {}, `Unchanged links (${links.relations}, not drawn)`));
      for (const item of Array.isArray(links.items) ? links.items : []) {
        const columns = (item.columns || []).join(", ");
        box.append(el("div", { class: "was" }, item.direction === "referencedBy"
          ? `← ${item.name} (${columns}) references ${table.name}`
          : `→ ${table.name} references ${item.name} (${columns})`));
      }
      if (links.more) box.append(el("div", { class: "was" }, `+${links.more} more`));
      detail.append(box);
    }
    const relations = (Array.isArray(state.model.relations) ? state.model.relations : []).filter((relation) => relation.source === table.id || relation.target === table.id);
    if (relations.length) {
      const box = el("div", { class: "defs" }, el("div", {}, "Relations"));
      for (const relation of relations) {
        const relationKind = ["added", "removed"].includes(relation.kind) ? relation.kind : "unchanged";
        box.append(el("div", { class: relationKind === "unchanged" ? "" : "k-" + relationKind },
          `${MARK[relationKind]} ${relation.source} (${(relation.sourceColumns || []).join(", ")}) → ${relation.target} (${(relation.targetColumns || []).join(", ")})`));
      }
      detail.append(box);
    }
    requestAnimationFrame(reportSize);
  }

  // ---- Selection ----
  function select(id, reveal) {
    state.group = null;
    state.selected = id && state.nodes.has(id) ? id : null;
    const keep = new Set();
    if (state.selected) {
      keep.add(state.selected);
      for (const group of document.querySelectorAll(".edge-group")) {
        if (group.dataset.source === state.selected) keep.add(group.dataset.target);
        if (group.dataset.target === state.selected) keep.add(group.dataset.source);
      }
    }
    for (const node of document.querySelectorAll(".node")) {
      node.classList.toggle("selected", node.dataset.id === state.selected);
      node.classList.toggle("faded", !!state.selected && !keep.has(node.dataset.id));
    }
    for (const group of document.querySelectorAll(".edge-group")) {
      const touches = group.dataset.source === state.selected || group.dataset.target === state.selected;
      group.classList.toggle("faded", !!state.selected && !touches);
      group.classList.toggle("touching", !!state.selected && touches);
    }
    for (const button of document.querySelectorAll(".list button")) {
      button.setAttribute("aria-pressed", String(button.dataset.id !== undefined && button.dataset.id === state.selected));
    }
    renderDetail(state.selected ? state.nodes.get(state.selected).table : null);
    updatePosition();
    if (state.selected && reveal) revealNode(state.nodes.get(state.selected));
  }
  function selectGroup(index) {
    const group = (state.model.changeGroups || [])[index];
    if (!group) return;
    state.selected = null;
    state.group = index;
    const members = new Set(group.tables);
    const keep = new Set(members);
    for (const edge of document.querySelectorAll(".edge-group")) {
      const { source, target, kind } = edge.dataset;
      if (kind !== "unchanged" && (members.has(source) || members.has(target))) { keep.add(source); keep.add(target); }
    }
    for (const node of document.querySelectorAll(".node")) {
      node.classList.toggle("selected", members.has(node.dataset.id));
      node.classList.toggle("faded", !keep.has(node.dataset.id));
    }
    for (const edge of document.querySelectorAll(".edge-group")) {
      const { source, target, kind } = edge.dataset;
      const inGroup = kind !== "unchanged" && (members.has(source) || members.has(target));
      edge.classList.toggle("faded", !inGroup);
      edge.classList.remove("touching");
    }
    for (const button of document.querySelectorAll(".list button")) {
      button.setAttribute("aria-pressed", String(button.dataset.group === String(index)));
    }
    const detail = $("detail");
    detail.replaceChildren(el("div", { class: "row" }, el("h2", {}, `${group.count} tables share one change`)),
      el("p", { class: "mono" }, group.summary),
      el("div", { class: "items row" }, group.tables.map((id) => {
        const node = state.nodes.get(id);
        return el("button", { type: "button", onclick: () => select(id, true) }, node ? node.table.name : id);
      })));
    detail.hidden = false;
    $("position").textContent = `${group.count} tables`;
    fitTo([...keep]);
    requestAnimationFrame(reportSize);
  }
  function fitTo(ids) {
    const nodes = ids.map((id) => state.nodes.get(id)).filter(Boolean);
    if (!nodes.length) return;
    const minX = Math.min(...nodes.map((n) => n.x)) - 30, minY = Math.min(...nodes.map((n) => n.y)) - 30;
    const maxX = Math.max(...nodes.map((n) => n.x + n.width)) + 30, maxY = Math.max(...nodes.map((n) => n.y + n.height)) + 30;
    const ratio = aspect();
    let w = Math.max(maxX - minX, 420), h = Math.max(maxY - minY, 260);
    if (w / h > ratio) h = w / ratio; else w = h * ratio;
    animateTo({ x: (minX + maxX) / 2 - w / 2, y: (minY + maxY) / 2 - h / 2, w, h });
  }
  function step(direction) {
    if (!state.order.length) return;
    const index = state.order.indexOf(state.selected);
    const next = index < 0 ? (direction > 0 ? 0 : state.order.length - 1) : (index + direction + state.order.length) % state.order.length;
    select(state.order[next], true);
  }
  function updatePosition() {
    const index = state.order.indexOf(state.selected);
    $("position").textContent = state.order.length ? (index < 0 ? `${state.order.length} changes` : `${index + 1} of ${state.order.length}`) : "";
  }

  // ---- Camera ----
  function setViewBox(vb) {
    state.vb = vb;
    const graph = $("graph");
    graph.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
    // Like the app's diff view, unchanged relations appear once zoomed in (or for a selection).
    graph.classList.toggle("show-unchanged", ($("canvas").clientWidth || 640) / vb.w >= 0.7);
  }
  function aspect() {
    const canvas = $("canvas");
    return Math.max(0.2, (canvas.clientWidth || 600) / (canvas.clientHeight || 440));
  }
  function fit(animated) {
    if (!state.bounds) return;
    const b = state.bounds, ratio = aspect();
    let w = Math.max(b.w, 420), h = Math.max(b.h, 260);
    if (w / h > ratio) h = w / ratio; else w = h * ratio;
    const target = { x: b.x + b.w / 2 - w / 2, y: b.y + b.h / 2 - h / 2, w, h };
    animated ? animateTo(target) : setViewBox(target);
  }
  function zoom(factor, point) {
    if (!state.vb) return;
    const vb = state.vb;
    const limit = state.bounds ? Math.max(state.bounds.w, state.bounds.h) * 3 : 5000;
    const w = Math.min(Math.max(vb.w * factor, 160), limit);
    const applied = w / vb.w;
    const p = point || { x: vb.x + vb.w / 2, y: vb.y + vb.h / 2 };
    setViewBox({ x: p.x - (p.x - vb.x) * applied, y: p.y - (p.y - vb.y) * applied, w, h: vb.h * applied });
  }
  function revealNode(node) {
    const vb = state.vb;
    if (!vb || !node) return;
    // Step to a readable scale (about 1:1) around the change, but never zoom
    // out from a closer view the reader chose.
    const readable = Math.max(node.width * 1.6, ($("canvas").clientWidth || 640) * 1.1);
    const w = Math.max(Math.min(vb.w, readable), node.width * 1.6);
    const h = w * vb.h / vb.w;
    const inside = node.x >= vb.x && node.y >= vb.y && node.x + node.width <= vb.x + vb.w && node.y + node.height <= vb.y + vb.h;
    if (inside && w === vb.w) return;
    const c = center(node);
    animateTo({ x: c.x - w / 2, y: c.y - h / 2, w, h });
  }
  let animation = 0;
  function animateTo(target) {
    const start = state.vb || target, began = performance.now(), id = ++animation;
    const tick = (now) => {
      if (id !== animation) return;
      const t = Math.min(1, (now - began) / 220), e = 1 - Math.pow(1 - t, 3);
      setViewBox({ x: start.x + (target.x - start.x) * e, y: start.y + (target.y - start.y) * e, w: start.w + (target.w - start.w) * e, h: start.h + (target.h - start.h) * e });
      if (t < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
  function toGraphPoint(event) {
    const graph = $("graph");
    const matrix = graph.getScreenCTM();
    if (!matrix) return null;
    const point = graph.createSVGPoint();
    point.x = event.clientX; point.y = event.clientY;
    const mapped = point.matrixTransform(matrix.inverse());
    return { x: mapped.x, y: mapped.y };
  }

  const canvas = $("canvas");
  canvas.addEventListener("wheel", (event) => {
    // Plain scrolling keeps scrolling the conversation; pinch or ⌘/Ctrl-scroll zooms.
    if (!event.ctrlKey && !event.metaKey) return;
    event.preventDefault();
    zoom(Math.exp(event.deltaY * 0.0022), toGraphPoint(event));
  }, { passive: false });
  let drag = null;
  canvas.addEventListener("pointerdown", (event) => {
    if (event.button !== 0 || !state.vb) return;
    drag = { x: event.clientX, y: event.clientY, vb: { ...state.vb }, moved: false, target: event.target };
    canvas.setPointerCapture(event.pointerId);
  });
  canvas.addEventListener("pointermove", (event) => {
    if (!drag) return;
    const dx = event.clientX - drag.x, dy = event.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) < 4) return;
    drag.moved = true;
    canvas.classList.add("panning");
    const scale = drag.vb.w / (canvas.clientWidth || 1);
    setViewBox({ ...drag.vb, x: drag.vb.x - dx * scale, y: drag.vb.y - dy * scale });
  });
  const endDrag = (event) => {
    if (!drag) return;
    const wasClick = !drag.moved, target = drag.target;
    drag = null;
    canvas.classList.remove("panning");
    if (event.type === "pointerup" && wasClick) {
      const node = target && target.closest ? target.closest(".node") : null;
      select(node ? node.dataset.id : null, false);
    }
  };
  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", endDrag);
  document.addEventListener("keydown", (event) => {
    if (!state.model || event.target instanceof HTMLButtonElement) return;
    if (event.key === "ArrowDown" || event.key === "ArrowRight" || event.key === "j") { event.preventDefault(); step(1); }
    else if (event.key === "ArrowUp" || event.key === "ArrowLeft" || event.key === "k") { event.preventDefault(); step(-1); }
    else if (event.key === "Escape") select(null, false);
    else if (event.key === "+" || event.key === "=") zoom(0.8);
    else if (event.key === "-") zoom(1.25);
    else if (event.key === "0") fit(true);
  });
  $("prev").addEventListener("click", () => step(-1));
  $("next").addEventListener("click", () => step(1));
  $("zoom-in").addEventListener("click", () => zoom(0.8));
  $("zoom-out").addEventListener("click", () => zoom(1.25));
  $("fit").addEventListener("click", () => fit(true));

  // ---- Display mode ----
  function updateExpandButton() {
    const button = $("expand");
    button.hidden = !state.modes.includes("fullscreen");
    button.textContent = state.displayMode === "fullscreen" ? "Collapse" : "Expand";
  }
  $("expand").addEventListener("click", () => {
    const mode = state.displayMode === "fullscreen" ? "inline" : "fullscreen";
    request("ui/request-display-mode", { mode }).then((result) => {
      state.displayMode = (result && result.mode) || mode;
      updateExpandButton();
      sizeCanvas();
      fit(true);
    }).catch(() => {});
  });
  function sizeCanvas() {
    const canvasElement = $("canvas");
    if (state.displayMode === "fullscreen") {
      const available = (state.hostHeight || window.innerHeight) - canvasElement.getBoundingClientRect().top - 24;
      canvasElement.style.height = Math.max(320, Math.round(available)) + "px";
    } else if (state.bounds) {
      // Inline, follow the graph's shape so small reviews don't sit in empty space.
      const width = canvasElement.clientWidth || 640;
      const height = width * state.bounds.h / Math.max(state.bounds.w, 420);
      const minimum = state.nodes.size > 12 ? 380 : 220;
      canvasElement.style.height = Math.round(Math.min(460, Math.max(minimum, height))) + "px";
    } else {
      canvasElement.style.height = "";
    }
  }
  let lastWidth = 0;
  window.addEventListener("resize", () => {
    // Height changes come from the host fitting this view; only width changes need a refit.
    if (state.displayMode !== "fullscreen" && window.innerWidth === lastWidth) return;
    lastWidth = window.innerWidth;
    sizeCanvas();
    fit(false);
  });
})();
</script>
</body>
</html>
