<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQLite Graph Studio</title>
<style>
:root { color-scheme: light dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; padding: 12px; color: var(--color-text-primary, CanvasText); font: 13px/1.45 var(--font-sans, -apple-system, system-ui, sans-serif); }
header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
strong { font-size: 14px; }
#source { color: var(--color-text-secondary, GrayText); overflow-wrap: anywhere; }
#following { margin-left: auto; min-width: 15ch; text-align: right; font-size: 12px; color: var(--color-text-secondary, GrayText); }
#surface { position: relative; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
#surface.with-data { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); }
#canvas { position: relative; height: 440px; overflow: hidden; border-radius: 8px; border: 1px solid var(--color-border-primary, GrayText); background: var(--color-background-secondary, Canvas); cursor: grab; touch-action: none; }
#canvas.panning { cursor: grabbing; }
#frame, .frame-ghost { display: block; position: absolute; transform-origin: 0 0; user-select: none; pointer-events: none; }
#graph-toolbar { position: absolute; right: 8px; top: 8px; z-index: 3; max-width: calc(100% - 16px); display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
#graph-toolbar button { min-height: 28px; padding: 3px 8px; font-size: 12px; }
#node-drag { position: absolute; overflow: hidden; pointer-events: none; z-index: 2; border-radius: 8px; box-shadow: 0 6px 18px #0003; }
#node-drag img { position: absolute; max-width: none; }
#canvas.over-node { cursor: default; }
#canvas.dragging-node { cursor: grabbing; }
#data-panel { min-width: 0; height: 440px; display: flex; flex-direction: column; }
#data-title, .data-ghost h2 { font-size: 14px; margin: 0 0 8px; max-height: 2.9em; overflow: auto; }
.data-grid { min-height: 0; flex: 1; max-height: 405px; overflow: auto; border: 1px solid var(--color-border-primary, GrayText); border-radius: 8px; }
.data-grid table { width: 100%; border-collapse: separate; border-spacing: 0; font: 12px/1.5 var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace); }
.data-grid th, .data-grid td { padding: 7px 10px; text-align: left; white-space: pre; border-bottom: 1px solid var(--color-border-primary, GrayText); }
.data-grid th { position: sticky; top: 0; background: var(--color-background-secondary, Canvas); z-index: 1; }
.data-grid th small { display: block; font: 10px/1.4 var(--font-sans, system-ui); font-weight: 400; color: var(--color-text-secondary, GrayText); }
.data-grid .special { color: var(--color-text-secondary, GrayText); font-style: italic; }
.data-grid .row-number { color: var(--color-text-secondary, GrayText); text-align: right; }
#data-note, .data-ghost p { font-size: 12px; color: var(--color-text-secondary, GrayText); margin: 6px 0 0; max-height: 4.35em; overflow: auto; }
.data-ghost { position: absolute; pointer-events: none; z-index: 2; }
@media (max-width: 640px) { #surface.with-data { grid-template-columns: minmax(0, 1fr); } #canvas { height: 360px; } #data-panel { height: 310px; } .data-grid { max-height: 260px; } }
#caption { margin: 12px 0 0; height: 4.35em; overflow: auto; white-space: pre-wrap; overscroll-behavior: contain; }
#navigation { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 34px; font: inherit; color: inherit; border: 1px solid var(--color-border-primary, GrayText); border-radius: 6px; background: var(--color-background-primary, Canvas); padding: 5px 10px; cursor: pointer; }
button:disabled { opacity: .4; cursor: default; }
button:focus-visible { outline: 2px solid #669cf3; outline-offset: 2px; }
button svg { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; }
.brand { border: 0; background: transparent; padding: 2px 6px 2px 2px; min-height: 28px; gap: 7px; }
.brand img { width: 22px; height: 22px; display: block; }
.brand:hover { background: var(--color-background-secondary, Canvas); }
#position { min-width: 4ch; text-align: center; font-variant-numeric: tabular-nums; color: var(--color-text-secondary, GrayText); }
#status { position: absolute; left: 8px; right: 8px; bottom: 8px; z-index: 3; margin: 0; padding: 5px 8px; max-height: 3.9em; overflow: auto; overscroll-behavior: contain; border-radius: 6px; background: var(--color-background-primary, Canvas); color: var(--color-text-secondary, GrayText); }
#status:empty { display: none; }
#status.error { color: var(--color-text-danger, #b85326); }
</style>
</head>

<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const pending = new Map();
  let id = 0, args = null, data = null, toolInput = null, lastResult = null,
      generation = 0, frameEpoch = 0, frameBusy = false, controlBusy = false,
      renderedPointID = null, acknowledgedFrame = null, pollSoon = false,
      stopped = false, openBusy = false, transientFailures = 0, timer, dataKey = null, gestureTimer,
      motion = null, layoutPending = false, settled = false, frameBox = null, frameGraph = null;
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const identity = () => ({s:1,tx:0,ty:0});
  const compose = (a,b) => ({s:a.s*b.s,tx:a.s*b.tx+a.tx,ty:a.s*b.ty+a.ty});
  const inverse = a => ({s:1/a.s,tx:-a.tx/a.s,ty:-a.ty/a.s});
  const isIdentity = a => Math.abs(a.s-1)<1e-6 && Math.abs(a.tx)<.01 && Math.abs(a.ty)<.01;
  let local = identity(), sent = identity(), queuedActions = [];
  function preview() { $("frame").style.transform = `matrix(${local.s},0,0,${local.s},${local.tx},${local.ty})`; }
  function resetGestures() {
    if(drag){try{$("canvas").releasePointerCapture(drag.pointerId);}catch{}drag=null;}
    $("node-drag").hidden=true; $("canvas").classList.remove('panning','dragging-node');
    local=identity(); sent=identity(); queuedActions=[]; clearTimeout(gestureTimer); preview();
  }
  function graphSize() { return {width:Math.min(1200,Math.max(320,Math.round($("canvas").clientWidth))),height:Math.min(720,Math.max(240,Math.round($("canvas").clientHeight)))}; }
  // Measure the target columns in this task, then restore them before the browser
  // paints. The old view stays readable while its correctly sized frame loads.
  function sizeForLayout(view) {
    const surface=$("surface"), panel=$("data-panel"), hadData=surface.classList.contains('with-data'), hidden=panel.hidden;
    surface.classList.toggle('with-data',!!view); panel.hidden=!view;
    const size=graphSize();
    surface.classList.toggle('with-data',hadData); panel.hidden=hidden;
    return size;
  }
  function fittedFrame(info, image) {
    const width=info.graph?.width || image.naturalWidth, height=info.graph?.height || image.naturalHeight;
    const scale=Math.min($("canvas").clientWidth/width,$("canvas").clientHeight/height);
    return {width:width*scale,height:height*scale,left:($("canvas").clientWidth-width*scale)/2,
      top:($("canvas").clientHeight-height*scale)/2,scale};
  }
  function placeFrame(image, box) {
    for(const key of ['width','height','left','top'])image.style[key]=box[key]+'px';
  }
  function finishMotion() {
    if(motion)for(const animation of motion.animations) { try { animation.finish(); } catch {} }
  }
  function cancelMotion() {
    if(!motion)return;
    const previous=motion; motion=null;
    clearTimeout(previous.deadline);
    for(const animation of previous.animations)animation.cancel();
    for(const element of previous.ghosts)element.remove();
    $("surface").style.overflow='';
    previous.resolve(false);
  }
  function interruptMotionForGesture() {
    if(!motion)return;
    cancelMotion(); frameEpoch++; frameBusy=false; renderedPointID=null; settled=true;
    $("surface").setAttribute('aria-busy','false'); controls();
  }
  function cameraBetween(from, fromBox, to, toBox) {
    if(!from || !to || ![from.zoom,from.pan_x,from.pan_y,to.zoom,to.pan_x,to.pan_y].every(Number.isFinite))return null;
    const scale=to.zoom*toBox.scale/(from.zoom*fromBox.scale);
    const tx=toBox.left+toBox.scale*(to.width/2+to.pan_x)-fromBox.left-scale*fromBox.scale*(from.width/2+from.pan_x);
    const ty=toBox.top+toBox.scale*(to.height/2+to.pan_y)-fromBox.top-scale*fromBox.scale*(from.height/2+from.pan_y);
    // Large jumps between unrelated parts of a model read better as a short fade.
    if(!Number.isFinite(scale) || scale<.5 || scale>2 || Math.hypot(tx,ty)>Math.max(toBox.width,toBox.height)*1.25)return null;
    return `matrix(${scale},0,0,${scale},${tx},${ty})`;
  }
  function animateView(before, imageChanged, dataChanged, captionChanged) {
    if(!before || reducedMotion.matches || typeof $("frame").animate!=='function')return Promise.resolve(true);
    const surface=$("surface"), canvas=$("canvas"), after=canvas.getBoundingClientRect();
    const layoutChanged=Math.abs(before.canvas.width-after.width)>.5 || Math.abs(before.surface.height-surface.getBoundingClientRect().height)>.5;
    if(!imageChanged && !dataChanged && !captionChanged && !layoutChanged)return Promise.resolve(true);
    const duration=layoutChanged?320:260, animations=[], ghosts=[];
    const animate=(element,frames,ms=duration)=>animations.push(element.animate(frames,{duration:ms,easing:'cubic-bezier(.22,.68,0,1)'}));
    if(imageChanged || layoutChanged) {
      const ghost=before.image; ghost.className='frame-ghost'; ghost.removeAttribute('id'); ghost.alt=''; ghost.setAttribute('aria-hidden','true');

      const forward=cameraBetween(before.graph,before.box,data.graph,frameBox);
      const backward=cameraBetween(data.graph,frameBox,before.graph,before.box);
      animate(ghost,[{opacity:1,transform:'none'},{opacity:0,transform:forward || 'none'}]);
      animate($("frame"),[{opacity:0,transform:backward || 'none'},{opacity:1,transform:'none'}]);
    }
    if(layoutChanged) {
      // Resize the clipping viewport, never stretch its text or graph bitmap.
      animate(canvas,[{width:before.canvas.width+'px'},{width:after.width+'px'}]);
      const height=surface.getBoundingClientRect().height;
      if(Math.abs(before.surface.height-height)>.5) {
        surface.style.overflow='hidden';
        animate(surface,[{height:before.surface.height+'px'},{height:height+'px'}]);
      }
    }
    if(dataChanged) {
      if(before.panel) {
        const ghost=before.panel; ghost.removeAttribute('id');
        for(const element of ghost.querySelectorAll('[id]'))element.removeAttribute('id');
        for(const element of ghost.querySelectorAll('[tabindex]'))element.removeAttribute('tabindex');
        ghost.className='data-ghost'; ghost.setAttribute('aria-hidden','true'); ghost.inert=true;

        surface.append(ghost); ghosts.push(ghost);
        animate(ghost,[{opacity:1,transform:'translateX(0)'},{opacity:0,transform:'translateX(8px)'}],180);
      }
      if(!$("data-panel").hidden)animate($("data-panel"),[{opacity:0,transform:'translateX(12px)'},{opacity:1,transform:'translateX(0)'}]);
    }
    if(captionChanged && !$("caption").hidden)animate($("caption"),[{opacity:0,transform:'translateY(4px)'},{opacity:1,transform:'translateY(0)'}],180);
    return new Promise(resolve=>{
      const current={animations,ghosts,resolve}; motion=current;
      // Hosts can composite a card while WebKit reports it hidden and throttles
      // its timeline. Finish at the target state before acknowledging visibility.
      current.deadline=setTimeout(()=>{if(motion===current)finishMotion();},duration+120);
      Promise.all(animations.map(animation=>animation.finished)).then(()=>{
        if(motion!==current)return;
        clearTimeout(current.deadline);
        motion=null;
        for(const animation of animations)animation.cancel();
        for(const element of ghosts)element.remove();
        surface.style.overflow=''; resolve(true);
      }).catch(()=>{if(motion===current)cancelMotion();});
    });
  }
  reducedMotion.addEventListener('change',()=>{if(reducedMotion.matches)finishMotion();});
  function interactive() { return !!(args && data && frameGraph && !$("frame").hidden && data.render_surface==='graph' && !stopped && !controlBusy && !layoutPending &&
    (!data.presentation || data.presentation.view_ready || data.presentation.needs_view_replay)); }
  const post = message => window.parent.postMessage(message, "*");
  const notify = (method, params = {}) => post({jsonrpc:"2.0", method, params});
  function request(method, params) {
    const requestID = ++id;
    return new Promise((resolve, reject) => {

  canvas.addEventListener('gesturechange',event=>{if(!interactive())return;event.preventDefault();zoomAt(event.scale/lastScale,pointOf(event));lastScale=event.scale;});
  canvas.addEventListener('keydown',event=>{
    if(!interactive() || event.target!==canvas)return;
    if(event.key.toLowerCase()==='f'){event.preventDefault();graphAction({type:'fit'});}
    else if(event.key==='Enter' && frameGraph.selection?.length===1){event.preventDefault();graphAction({type:'expand',table_id:frameGraph.selection[0]});}
    else if(['+','=','-'].includes(event.key)){event.preventDefault();zoomAt(event.key==='-'?1/1.15:1.15,{x:canvas.clientWidth/2,y:canvas.clientHeight/2});}
    else if(event.key.startsWith('Arrow')){event.preventDefault();queueGesture({s:1,tx:event.key==='ArrowLeft'?30:event.key==='ArrowRight'?-30:0,ty:event.key==='ArrowUp'?30:event.key==='ArrowDown'?-30:0});}
  });
  new ResizeObserver(()=>{if(args && data && data.render_surface==='graph' && !motion && !layoutPending){pollSoon=true;if(!frameBusy && !controlBusy)schedule(true);}}).observe(canvas);
  document.addEventListener("visibilitychange", () => {if(document.hidden)finishMotion(); schedule();});
  window.addEventListener("message", event => {
    if (event.source !== window.parent) return;
    const m = event.data;
    if (!m || m.jsonrpc !== "2.0") return;
    if (m.id != null && pending.has(m.id) && ("result" in m || "error" in m)) {
      const p = pending.get(m.id); pending.delete(m.id); clearTimeout(p.timeout);
      if (m.error) { const error = new Error(m.error.message || "Reconnecting to Graph Studio…"); error.code = "HOST_REQUEST_FAILED"; p.reject(error); }
      else p.resolve(m.result);
    } else if (m.method === "ui/notifications/tool-result") receive(m.params);
    else if (m.method === "ui/notifications/tool-input") { toolInput = m.params && m.params.arguments; if (!args && lastResult) receive(lastResult); }
    else if (m.method === "ui/notifications/host-context-changed") hostContext(m.params);
    else if (m.method === "ui/notifications/tool-cancelled") { release(); cancelMotion(); layoutPending=false; clearTimeout(timer); generation++; stopped = true; status("View cancelled. The last captured state remains visible."); controls(); }
    else if (m.method === "ui/resource-teardown") { release(); cancelMotion(); layoutPending=false; clearTimeout(timer); generation++; stopped = true; for (const p of pending.values()) { clearTimeout(p.timeout); p.reject(new Error("View closed.")); } pending.clear(); post({jsonrpc:"2.0", id:m.id, result:{}}); }
    else if (m.method === "ping") post({jsonrpc:"2.0", id:m.id, result:{}});
  });
  request("ui/initialize", {appInfo:{name:"SQLite Graph Studio",version:"1.1.0"},protocolVersion:"2026-01-26",appCapabilities:{}})
    .then(result => { hostContext(result.hostContext); notify("ui/notifications/initialized"); resize(); })
    .catch(error => status(error.message, true));
})();
</script>
